# Looser settings for short recordings and quiet markets (demo / tuning).
exchanges:
  bybit: [BTCUSDT, ETHUSDT, SOLUSDT]
windows:
  short_seconds: 30
  baseline_seconds: 300
filters:
  min_imbalance: 0.5
  min_activity: 2.5
  min_price_change: 0.0012
  min_trades: 30
  min_volume: 200000
  cooldown_seconds: 120
